# Production Docker Compose
# This configuration is for production deployment with an external Slurm cluster.
#
# Prerequisites:
#   - External Slurm cluster with slurmrestd API enabled
#   - Shared filesystem accessible by both backend and Slurm compute nodes
#   - All environment variables set (no defaults for security)
#   - Reverse proxy (Traefik, Caddy, etc.) for SSL termination recommended
#
# Required environment variables (set in .env or deployment config):
#   - POSTGRES_PASSWORD: PostgreSQL password
#   - OPENAI_API_KEY: LLM API key
#   - SLURM_API_URL: slurmrestd API URL
#   - SLURM_AUTH_TOKEN: Slurm JWT token
#   - SLURM_STAGING_DIR: Shared staging directory path
#   - KEYCLOAK_URL: Internal Keycloak URL (e.g. http://keycloak:8080/keycloak)
#   - KC_HOSTNAME: Public hostname for Keycloak (e.g. syxplain.example.org)
#   - KEYCLOAK_ISSUER: https://<KC_HOSTNAME>/keycloak/realms/syxplain
#   - SERVER_NAME: Public domain for nginx/HTTPS (usually the same as KC_HOSTNAME)
#
# Architecture:
#   Single PostgreSQL instance shared by backend (public schema) and
#   Keycloak (keycloak schema). The init script creates the keycloak
#   schema and a dedicated keycloak_user role on first startup.
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:18
    container_name: syxplain-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=syxplain
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=syxplain
      - KC_DB_PASSWORD=${KC_DB_PASSWORD:?KC_DB_PASSWORD is required}
    volumes:
      - syxplain_pgdata:/var/lib/postgresql
      - ./db/init-keycloak-schema.sh:/docker-entrypoint-initdb.d/init-keycloak-schema.sh:ro
    networks:
      - syxplain-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syxplain"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/hun-ren-ai1science/syxplain-backend:latest}
    container_name: syxplain-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # LLM Configuration (REQUIRED)
      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-4o}
      - SMALL_MODEL_NAME=${SMALL_MODEL_NAME:-gpt-5-mini}
      - SMALL_USER_MODEL_NAME=${SMALL_USER_MODEL_NAME:-gemini-2.5-flash}
      - USER_API_MODELS=${USER_API_MODELS:-gpt-4o,gpt-4.1}
      # GitHub Feedback (optional)
      - GITHUB_FEEDBACK_TOKEN=${GITHUB_FEEDBACK_TOKEN:-}
      - GITHUB_FEEDBACK_REPO_OWNER=${GITHUB_FEEDBACK_REPO_OWNER:-}
      - GITHUB_FEEDBACK_REPO_NAME=${GITHUB_FEEDBACK_REPO_NAME:-}
      # Database (shared PostgreSQL)
      - DATABASE_URL=postgresql://syxplain:${POSTGRES_PASSWORD}@postgres:5432/syxplain
      - DB_POOL_SIZE=${DB_POOL_SIZE:-40}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-5}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - DB_POOL_RECYCLE=${DB_POOL_RECYCLE:-300}
      # Authentication (Keycloak - internal Docker URL)
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak:8080/keycloak}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-syxplain}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-syxplain-frontend}
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER:?KEYCLOAK_ISSUER is required (https://<your-domain>/keycloak/realms/syxplain)}
      - SERVER_KEYS_ROLE=${SERVER_KEYS_ROLE:-server-llm-access}
      - KEYCLOAK_ALLOWED_CLIENTS=${KEYCLOAK_ALLOWED_CLIENTS:-}
      # Slurm Configuration (REQUIRED - connects to external cluster)
      - SLURM_API_URL=${SLURM_API_URL:?SLURM_API_URL is required}
      - SLURM_AUTH_TOKEN=${SLURM_AUTH_TOKEN:?SLURM_AUTH_TOKEN is required}
      - SLURM_USER_NAME=${SLURM_USER_NAME:?SLURM_USER_NAME is required}
      - SLURM_PARTITION=${SLURM_PARTITION:-}
      - SLURM_CPUS=${SLURM_CPUS:-8}
      - SLURM_MEMORY=${SLURM_MEMORY:-16G}
      - SLURM_TIME_LIMIT=${SLURM_TIME_LIMIT:-04:00:00}
      - SLURM_STAGING_DIR=${SLURM_STAGING_DIR:?SLURM_STAGING_DIR is required}
      - SLURM_CONTAINER_PATH=${SLURM_CONTAINER_PATH:-}
      - SLURM_CONTAINER_BINDS=${SLURM_CONTAINER_BINDS:-}
      - SLURM_JULIA_DEPOT=${SLURM_JULIA_DEPOT:-}
      - SLURM_RETRY_INTERVAL=${SLURM_RETRY_INTERVAL:-60}
      # Compute settings
      - WORKER_CALLBACK_URL=${WORKER_CALLBACK_URL:-}
      - WORKER_CALLBACK_TOKEN=${WORKER_CALLBACK_TOKEN:-}
      - JOB_POLL_INTERVAL=${JOB_POLL_INTERVAL:-10}
      - COMPUTE_MAX_RETRIES=${COMPUTE_MAX_RETRIES:-3}
      # LLM cost accounting (prices for OpenAI models are built in)
      - LLM_PRICES_JSON=${LLM_PRICES_JSON:-}
      - LLM_WEB_SEARCH_USD=${LLM_WEB_SEARCH_USD:-0.01}
      # Analysis Settings
      - DISCOVERY_AGENT_ENABLED=${DISCOVERY_AGENT_ENABLED:-true}
      - DISCOVERY_AGENT_MODEL=${DISCOVERY_AGENT_MODEL:-}
      - DISCOVERY_SHAP_IMAGES=${DISCOVERY_SHAP_IMAGES:-true}
      - DISCOVERY_MAX_ITERS=${DISCOVERY_MAX_ITERS:-40}
      - DISCOVERY_MAX_PYSR_RUNS=${DISCOVERY_MAX_PYSR_RUNS:-6}
      - DISCOVERY_MAX_SINDY_RUNS=${DISCOVERY_MAX_SINDY_RUNS:-6}
      - DISCOVERY_WALL_CLOCK_MIN=${DISCOVERY_WALL_CLOCK_MIN:-150}
      - DISCOVERY_MAX_CONCURRENT_PYSR=${DISCOVERY_MAX_CONCURRENT_PYSR:-2}
      - DISCOVERY_PYSR_TIMEOUT_S=${DISCOVERY_PYSR_TIMEOUT_S:-1800}
      - DISCOVERY_REVIEW_STEPS=${DISCOVERY_REVIEW_STEPS:-5}
      - DISCOVERY_FIRST_RESULT_TIMEOUT_S=${DISCOVERY_FIRST_RESULT_TIMEOUT_S:-3600}
      - DISCOVERY_SPARSE_COLUMN_THRESHOLD=${DISCOVERY_SPARSE_COLUMN_THRESHOLD:-0.2}
      - DISCOVERY_MAX_CATEGORICAL_LEVELS=${DISCOVERY_MAX_CATEGORICAL_LEVELS:-10}
      - ANALYSIS_TIMEOUT_HOURS=${ANALYSIS_TIMEOUT_HOURS:-24}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - MAX_ACTIVE_RUNS_PER_USER=${MAX_ACTIVE_RUNS_PER_USER:-3}
      - MCP_MAX_CSV_KB=${MCP_MAX_CSV_KB:-256}
      # CORS (REQUIRED - set to your frontend domain)
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS is required}
    volumes:
      - ${SLURM_STAGING_DIR}:${SLURM_STAGING_DIR}
      - app_data:/app/data
      - app_outputs:/app/outputs
      - app_logs:/app/logs
    networks:
      - syxplain-network
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${BACKEND_CPU_LIMIT:-4}'
          memory: ${BACKEND_MEMORY_LIMIT:-4G}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/hun-ren-ai1science/syxplain-frontend:latest}
    container_name: syxplain-frontend
    restart: unless-stopped
    environment:
      # Public domain; HTTPS is enabled when /etc/letsencrypt/live/$SERVER_NAME exists
      - SERVER_NAME=${SERVER_NAME:-}
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    networks:
      - syxplain-network
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: syxplain-keycloak
    restart: unless-stopped
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/syxplain
      - KC_DB_USERNAME=keycloak_user
      - KC_DB_PASSWORD=${KC_DB_PASSWORD:?KC_DB_PASSWORD is required}
      - KC_DB_SCHEMA=keycloak
      - KC_HTTP_RELATIVE_PATH=/keycloak
      - KC_HOSTNAME=https://${KC_HOSTNAME:?KC_HOSTNAME is required}/keycloak
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
    command: start --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes/syxplain:/opt/keycloak/themes/syxplain:ro
    networks:
      - syxplain-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000;echo -e 'GET /keycloak/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;head -1 <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  syxplain-network:
    driver: bridge

volumes:
  syxplain_pgdata:
  app_data:
  app_outputs:
  app_logs:
  certbot_webroot:
