[tool.ruff]
target-version = "py310"
line-length = 100
include = ["backend/**/*.py", "slurm_worker/**/*.py", "*.py"]
exclude = [".git", ".venv", "__pycache__", "backend/alembic/versions/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # Line too long
    "E402",   # Module level import not at top (needed for some FastAPI patterns)
    "B008",   # FastAPI dependency injection pattern
    "B904",   # Re-raise in except (common in FastAPI)
    "RUF002", # Ambiguous unicode chars in docstrings
    "RUF005", # List concatenation style (preference)
    "RUF012", # Mutable class attributes (Pydantic Config classes)
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "slurm_worker"]

[tool.ruff.format]
quote-style = "double"
