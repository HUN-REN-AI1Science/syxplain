name: syxplain
channels:
  - conda-forge
  - defaults
  - pytorch
dependencies:
  # Core Python
  - python=3.10

  # Core ML libraries
  - numpy>=1.21
  - pandas>=1.5
  - scikit-learn>=1.2
  - scipy>=1.9
  - shap>=0.47.2

  # Deep Learning
  - pytorch>=2.0

  # Symbolic Regression specific libraries
  - sympy>=1.11  # Symbolic mathematics
  - pySR>=0.12  # Symbolic regression library

  # Data visualization
  - matplotlib>=3.6
  - seaborn>=0.11
  - plotly>=5.0
  - bokeh

  # Jupyter ecosystem
  - jupyterlab
  - ipywidgets

  # Statistical analysis
  - statsmodels>=0.13
  - patsy

  # Optimization
  - optuna
  - hyperopt

  # Data processing
  - openpyxl  # Excel support
  - xlrd
  - h5py
  - netcdf4

  # Parallel processing
  - joblib
  - dask

  # Development tools
  - pytest
  - black
  - flake8
  - mypy

  # Additional utilities
  - tqdm
  - requests
  - pyyaml

  # Backend / API
  - fastapi
  - uvicorn
  - python-multipart
  - pyjwt

  # Database
  - sqlalchemy
  - psycopg2

  # Agentic
  - langgraph
  - langchain
  - langchain-openai
  - langchain-core
