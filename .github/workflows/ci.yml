name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One group per PR (or branch); superseded PR runs are cancelled, runs on main never are
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'
      - name: Ruff lint
        run: uv run --locked ruff check .
      - name: Ruff format
        run: uv run --locked ruff format --check .
      - name: Tests
        run: uv run --with-requirements requirements.txt pytest -q

  frontend:
    name: Frontend (lint + types + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build  # runs tsc first, so this is also the type check

  compose:
    name: Compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config -q
