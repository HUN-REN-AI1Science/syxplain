version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: monthly
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directories: [/src/backend, /src/frontend]
    schedule:
      interval: monthly
