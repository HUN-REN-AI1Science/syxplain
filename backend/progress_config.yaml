# Progress Configuration
# This file defines the pipeline stages and their progress percentages.
# Both backend (logger.py) and frontend (via API) use this config.

# Each phase has:
#   - name: Internal identifier used in log_step calls
#   - label: Human-readable label for UI
#   - description: User-friendly explanation of what's happening
#   - progress_end: The progress percentage when this phase completes
#   - increment_rate: How fast the frontend fake-increments during this phase (% per 500ms)

phases:
  # Init group (0-4%, all instant)
  - name: initialization
    label: "Initializing"
    description: "Setting up your analysis environment..."
    progress_end: 2
    increment_rate: 0.5

  - name: data_summary
    label: "Analyzing Data"
    description: "Analyzing your dataset structure and patterns..."
    progress_end: 3
    increment_rate: 0.5

  - name: visualization
    label: "Generating Charts"
    description: "Creating data visualizations..."
    progress_end: 4
    increment_rate: 0.5

  # LLM config generation (4-9%, ~13s — first noticeable wait)
  - name: pysr_config_generation
    label: "AI Configuration"
    description: "AI is analyzing your data to find the best approach..."
    progress_end: 9
    increment_rate: 0.25

  # HPC submission (9-10%, instant)
  - name: compute_submission
    label: "Submitting Jobs"
    description: "Submitting analysis to the computing cluster..."
    progress_end: 9
    increment_rate: 0.5

  - name: hpc_connecting
    label: "Connecting"
    description: "Connecting to the computing cluster..."
    progress_end: 9
    increment_rate: 0.5

  - name: hpc_queued
    label: "In Queue"
    description: "Your analysis jobs are queued for processing..."
    progress_end: 10
    increment_rate: 0.3

  - name: hpc_starting
    label: "Starting Compute"
    description: "Resources allocated! Starting analysis..."
    progress_end: 10
    increment_rate: 0.4

  # SHAP worker range (10-25%, ~10s — scaled by endpoint)
  - name: shap_running
    label: "SHAP Analysis"
    description: "Computing pairwise SHAP interaction values..."
    progress_end: 25
    increment_rate: 0.15

  # PySR worker range (25-75%, ~3.5min — scaled by endpoint)
  - name: pysr_starting
    label: "Equation Discovery"
    description: "Starting symbolic regression engine..."
    progress_end: 30
    increment_rate: 0.06

  - name: pysr_running
    label: "Finding Equations"
    description: "Discovering mathematical equations that fit your data... This may take a few minutes."
    progress_end: 75
    increment_rate: 0.04

  # Deep research (75-82%, optional)
  - name: deep_research
    label: "Deep Research"
    description: "Researching scientific literature to understand your equations..."
    progress_end: 78
    increment_rate: 0.25

  - name: deep_research_start
    label: "Deep Research"
    description: "Researching scientific literature to understand your equations..."
    progress_end: 78
    increment_rate: 0.25

  - name: deep_research_result
    label: "Research Complete"
    description: "Integrating scientific context into analysis..."
    progress_end: 82
    increment_rate: 0.25

  - name: deep_research_error
    label: "Research Error"
    description: "Continuing without deep research context..."
    progress_end: 82
    increment_rate: 0.25

  - name: deep_research_skip
    label: "Standard Analysis"
    description: "Proceeding with standard analysis..."
    progress_end: 82
    increment_rate: 0.25

  # LLM explanation (82-99%, ~20s)
  - name: llm_explanation
    label: "Explaining Results"
    description: "AI is interpreting your equations and generating insights..."
    progress_end: 90
    increment_rate: 0.25

  - name: phase_explanation
    label: "Generating Explanation"
    description: "AI is preparing to explain your equations..."
    progress_end: 85
    increment_rate: 0.25

  - name: equations_selected
    label: "Equations Selected"
    description: "Best equations identified, generating explanations..."
    progress_end: 87
    increment_rate: 0.25

  - name: llm_explanation_request
    label: "Explaining Results"
    description: "AI is interpreting your equations and generating insights..."
    progress_end: 92
    increment_rate: 0.25

  - name: llm_explanation_complete
    label: "Finalizing"
    description: "Preparing your final results..."
    progress_end: 95
    increment_rate: 0.25

  # Finalization (95-99%)
  - name: finalization
    label: "Finalizing"
    description: "Preparing your final results..."
    progress_end: 99
    increment_rate: 0.25
