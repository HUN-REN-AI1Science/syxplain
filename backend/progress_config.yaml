# Progress Configuration
# This file defines the pipeline stages and their progress percentages.
# Both backend (progress_service.py) and frontend (via API) use this config.

# Each phase has:
#   - name: Internal identifier used in update_progress calls
#   - label: Human-readable label for UI
#   - description: User-friendly explanation of what's happening
#   - progress_start: The progress percentage when this phase begins; the bar moves towards
#     the next phase's start while the phase runs
#   - expected_s: Typical duration in seconds. The frontend advances the bar along
#     1 - exp(-2t / expected_s): ~86% of the phase's span at expected_s, never past its end.
#
# Spans follow measured step times (prod run 5db8668d, 2026-10-28, ~12 min in total:
# setup ~3s, AI configuration ~20s, agent with two cluster searches ~10.5 min,
# scoring and literature instant, explanation ~80s).

phases:
  - name: initialization
    label: "Initializing"
    description: "Setting up your analysis environment..."
    progress_start: 0
    expected_s: 1

  - name: data_summary
    label: "Analyzing Data"
    description: "Analyzing your dataset structure and patterns..."
    progress_start: 1
    expected_s: 1

  - name: visualization
    label: "Generating Charts"
    description: "Creating data visualizations..."
    progress_start: 2
    expected_s: 3

  - name: pysr_config_generation
    label: "AI Configuration"
    description: "AI is analyzing your data to find the best approach..."
    progress_start: 3
    expected_s: 20

  - name: compute_submission
    label: "Submitting Jobs"
    description: "Submitting a first symbolic regression search to the computing cluster..."
    progress_start: 6
    expected_s: 2

  # The bulk of the run. The orchestrator advances the bar from the agent's steps and
  # elapsed time; the agent's steps stream to the UI as activity events.
  - name: discovery_agent
    label: "AI Scientist at Work"
    description: "An AI agent is profiling your data, designing equations from it and steering symbolic regression on the cluster..."
    progress_start: 7
    expected_s: 600

  - name: discovery_wrapup
    label: "Collecting Results"
    description: "Waiting for the last symbolic regression searches to finish..."
    progress_start: 85
    expected_s: 30

  # Known laws are fitted only after the blind exploration, as references.
  - name: relate_known_laws
    label: "Comparing with Known Laws"
    description: "Fitting named and published laws and comparing them with the discovered equations..."
    progress_start: 86
    expected_s: 20

  - name: final_scoring
    label: "Scoring Models"
    description: "Scoring every model on held-out data it has never seen..."
    progress_start: 87
    expected_s: 5

  - name: literature
    label: "Literature"
    description: "Comparing your equations with published laws..."
    progress_start: 88
    expected_s: 5

  - name: llm_explanation
    label: "Explaining Results"
    description: "AI is interpreting your equations and generating insights..."
    progress_start: 89
    expected_s: 80

  - name: finalization
    label: "Finalizing"
    description: "Preparing your final results..."
    progress_start: 98
    expected_s: 2
