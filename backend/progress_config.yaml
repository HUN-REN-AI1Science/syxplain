# Progress Configuration
# This file defines the pipeline stages and their progress percentages.
# Both backend (logger.py) and frontend (via API) use this config.

# Each phase has:
#   - name: Internal identifier used in log_step calls
#   - label: Human-readable label for UI
#   - description: User-friendly explanation of what's happening
#   - progress_end: The progress percentage when this phase completes
#   - increment_rate: How fast the frontend fake-increments during this phase (% per 500ms)

phases:
  # Init group (0-4%, all instant)
  - name: initialization
    label: "Initializing"
    description: "Setting up your analysis environment..."
    progress_end: 2
    increment_rate: 0.5

  - name: data_summary
    label: "Analyzing Data"
    description: "Analyzing your dataset structure and patterns..."
    progress_end: 3
    increment_rate: 0.5

  - name: visualization
    label: "Generating Charts"
    description: "Creating data visualizations..."
    progress_end: 4
    increment_rate: 0.5

  # LLM config for the baseline PySR search (4-9%, ~13s — first noticeable wait)
  - name: pysr_config_generation
    label: "AI Configuration"
    description: "AI is analyzing your data to find the best approach..."
    progress_end: 9
    increment_rate: 0.25

  # Baseline search submission (9-10%, instant)
  - name: compute_submission
    label: "Submitting Jobs"
    description: "Submitting a first symbolic regression search to the computing cluster..."
    progress_end: 10
    increment_rate: 0.5

  # Agentic discovery (10-72%). The orchestrator advances the bar with the agent's
  # time budget; the agent's steps stream to the UI as activity events.
  - name: discovery_agent
    label: "AI Scientist at Work"
    description: "An AI agent is profiling your data, fitting classic scientific laws and steering symbolic regression on the cluster..."
    progress_end: 72
    increment_rate: 0.02

  - name: discovery_wrapup
    label: "Collecting Results"
    description: "Waiting for the last symbolic regression searches to finish..."
    progress_end: 74
    increment_rate: 0.02

  - name: final_scoring
    label: "Scoring Models"
    description: "Scoring every model on held-out data it has never seen..."
    progress_end: 75
    increment_rate: 0.25

  # Deep research (75-82%, optional)
  - name: deep_research
    label: "Deep Research"
    description: "Researching scientific literature to understand your equations..."
    progress_end: 78
    increment_rate: 0.25

  - name: deep_research_start
    label: "Deep Research"
    description: "Researching scientific literature to understand your equations..."
    progress_end: 78
    increment_rate: 0.25

  - name: deep_research_result
    label: "Research Complete"
    description: "Integrating scientific context into analysis..."
    progress_end: 82
    increment_rate: 0.25

  - name: deep_research_error
    label: "Research Error"
    description: "Continuing without deep research context..."
    progress_end: 82
    increment_rate: 0.25

  - name: deep_research_skip
    label: "Standard Analysis"
    description: "Proceeding with standard analysis..."
    progress_end: 82
    increment_rate: 0.25

  # LLM explanation (82-99%, ~20s)
  - name: llm_explanation
    label: "Explaining Results"
    description: "AI is interpreting your equations and generating insights..."
    progress_end: 90
    increment_rate: 0.25

  - name: phase_explanation
    label: "Generating Explanation"
    description: "AI is preparing to explain your equations..."
    progress_end: 85
    increment_rate: 0.25

  - name: equations_selected
    label: "Equations Selected"
    description: "Best equations identified, generating explanations..."
    progress_end: 87
    increment_rate: 0.25

  - name: llm_explanation_request
    label: "Explaining Results"
    description: "AI is interpreting your equations and generating insights..."
    progress_end: 92
    increment_rate: 0.25

  - name: llm_explanation_complete
    label: "Finalizing"
    description: "Preparing your final results..."
    progress_end: 95
    increment_rate: 0.25

  # Finalization (95-99%)
  - name: finalization
    label: "Finalizing"
    description: "Preparing your final results..."
    progress_end: 99
    increment_rate: 0.25
