# pre-commit install   (once, after `uv sync` or `pip install pre-commit`)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3  # keep in sync with ruff in uv.lock
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: ^src/frontend/tsconfig.*\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        language: system
        entry: src/frontend/node_modules/.bin/prettier --write --ignore-unknown
        files: ^src/frontend/src/.*\.(ts|tsx|css|json)$
