# Development Docker Compose
# This configuration includes everything needed to run locally with hot reload:
# - PostgreSQL database
# - Backend API (with hot reload)
# - Frontend (with hot reload via Vite)
#
# IMPORTANT: Slurm Setup Required
# The backend connects to an external Slurm cluster at slurm.science-cloud.hu:6820.
# No SSH tunnel is needed - the API is publicly accessible.
# Before starting:
#   1. Generate token via SSH: ssh <user>@slurm.science-cloud.hu "scontrol token username=<user> lifespan=3600"
#   2. Configure .env with SLURM_* variables (see .env.example)
#
# Quick start:
#   1. Copy .env.example to .env and configure all required variables
#   2. Generate Slurm token (see README.md)
#   3. Run: docker-compose up --build

services:
  postgres:
    image: postgres:18
    container_name: syxplain-db
    environment:
      - POSTGRES_USER=syxplain
      - POSTGRES_PASSWORD=syxplain
      - POSTGRES_DB=syxplain
    ports:
      - "5432:5432"
    volumes:
      - syxplain_pgdata:/var/lib/postgresql
      - ./db/init-keycloak-schema.sh:/docker-entrypoint-initdb.d/init-keycloak-schema.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syxplain"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: syxplain-backend
    ports:
      - "8000:8000"
    environment:
      # LLM Configuration (set these in .env)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-4o}
      - DEEP_RESEARCH_MODEL=${DEEP_RESEARCH_MODEL:-}
      - DEEP_RESEARCH_API_KEY=${DEEP_RESEARCH_API_KEY:-}
      - DEEP_RESEARCH_API_BASE=${DEEP_RESEARCH_API_BASE:-}
      - USER_API_MODELS=${USER_API_MODELS:-gpt-4o,gpt-4.1}
      # GitHub Feedback (optional)
      - GITHUB_FEEDBACK_TOKEN=${GITHUB_FEEDBACK_TOKEN:-}
      - GITHUB_FEEDBACK_REPO_OWNER=${GITHUB_FEEDBACK_REPO_OWNER:-}
      - GITHUB_FEEDBACK_REPO_NAME=${GITHUB_FEEDBACK_REPO_NAME:-}
      # Database (defaults to local postgres container)
      - DATABASE_URL=postgresql://syxplain:syxplain@postgres:5432/syxplain
      # Authentication (Keycloak - internal Docker URL for backend)
      - KEYCLOAK_URL=http://keycloak:8080/keycloak
      - KEYCLOAK_REALM=syxplain
      - KEYCLOAK_CLIENT_ID=syxplain-frontend
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER:-}
      # Slurm Configuration - set these in .env (see README for setup)
      - SLURM_API_URL=${SLURM_API_URL}
      - SLURM_AUTH_TOKEN=${SLURM_AUTH_TOKEN}
      - SLURM_USER_NAME=${SLURM_USER_NAME:-ai4science}
      - SLURM_PARTITION=${SLURM_PARTITION:-batch_cpu_m2.large}
      - SLURM_STAGING_DIR=${SLURM_STAGING_DIR:-/storage/ai4science/syxplain}
      - SLURM_CPUS=${SLURM_CPUS:-4}
      - SLURM_MEMORY=${SLURM_MEMORY:-8G}
      - SLURM_TIME_LIMIT=${SLURM_TIME_LIMIT:-04:00:00}
      - SLURM_CONTAINER_PATH=${SLURM_CONTAINER_PATH:-}
      # Compute settings (set WORKER_CALLBACK_URL in .env for Slurm workers to reach backend)
      - WORKER_CALLBACK_URL=${WORKER_CALLBACK_URL:-http://backend:8000/api/internal}
      - WORKER_CALLBACK_TOKEN=${WORKER_CALLBACK_TOKEN:-dev-callback-token}
      - JOB_POLL_INTERVAL=5
      # Analysis Settings (sensible defaults for dev)
      - SHAP_SUBSAMPLE_FRACTION=0.1
      - SHAP_SUBSAMPLE_MIN=100
      - SHAP_SUBSAMPLE_MAX=1000
      - ANALYSIS_TIMEOUT_HOURS=2
      # CORS (allow all for local dev)
      - CORS_ORIGINS=*
      # Langfuse (optional tracing)
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-}
      - LANGFUSE_ENABLED=false
    volumes:
      - ./backend:/app/backend  # Mount source for hot reload
      - ./data:/app/data
      - ./outputs:/app/outputs
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Allow access to host network if needed
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    image: node:24-alpine
    container_name: syxplain-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
      - VITE_KEYCLOAK_URL=http://localhost:8080/keycloak
      - VITE_KEYCLOAK_REALM=syxplain
      - VITE_KEYCLOAK_CLIENT_ID=syxplain-frontend
      - VITE_ENABLE_MICROSOFT_SSO=${VITE_ENABLE_MICROSOFT_SSO:-false}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules  # Persist node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    container_name: syxplain-keycloak
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/syxplain
      - KC_DB_USERNAME=keycloak_user
      - KC_DB_PASSWORD=keycloak
      - KC_DB_SCHEMA=keycloak
      - KC_HTTP_RELATIVE_PATH=/keycloak
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - ./keycloak/themes/syxplain:/opt/keycloak/themes/syxplain
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  syxplain_pgdata:
  frontend_node_modules:
